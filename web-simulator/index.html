<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mafia Signs</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="cwa/cwasa.css" />
    <script src="cwa/allcsa.js"></script>
    <script src="avatar.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
        }

        body { display: flex; flex-direction: column; overflow: hidden; }

        button { font: inherit; cursor: pointer; }
        button:disabled { cursor: not-allowed; opacity: 0.5; }

        /* ---------- Header ---------- */
        #app-header {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            background: #1a1a2e;
            color: #fff;
        }

        #app-header .titles { min-width: 0; }
        #app-header h1 { font-size: 18px; line-height: 1.2; }
        #app-header p { font-size: 11px; color: #b8bcd4; margin-top: 2px; }

        #lang-switch { display: flex; gap: 4px; flex-shrink: 0; }

        .lang-btn {
            background: transparent;
            border: 1px solid #44486a;
            color: #cfd2e8;
            border-radius: 6px;
            padding: 6px 9px;
            font-size: 12px;
            font-weight: 600;
            min-height: 36px;
        }

        .lang-btn.active { background: #4a9eff; border-color: #4a9eff; color: #fff; }

        /* ---------- Layout ---------- */
        .layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-areas: "avatar" "sidebar";
            grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr);
            grid-template-columns: 1fr;
            gap: 0;
            overflow: hidden;
        }

        @media (min-width: 821px) {
            .layout {
                grid-template-areas: "sidebar avatar";
                grid-template-columns: 290px 1fr;
                grid-template-rows: 1fr;
            }
        }

        /* ---------- Sidebar ---------- */
        .sidebar {
            grid-area: sidebar;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-top: 1px solid #ddd;
            background: #fff;
        }

        @media (min-width: 821px) {
            .sidebar { border-top: none; border-right: 1px solid #ddd; }
        }

        #search-input {
            margin: 10px;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            min-height: 44px;
        }

        #category-list {
            display: flex;
            gap: 6px;
            padding: 0 10px 8px;
            overflow-x: auto;
        }

        .category-chip {
            flex-shrink: 0;
            border: 1px solid #ccc;
            background: #f4f4f4;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            min-height: 32px;
        }

        .category-chip.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }

        .list-scroll { flex: 1; overflow-y: auto; padding: 0 10px 10px; }

        .gesture-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 10px 10px;
            border: none;
            border-radius: 6px;
            background: none;
            font-size: 14px;
            min-height: 40px;
        }

        .gesture-item:hover { background: #eef3fc; }
        .gesture-item.selected { background: #0078d4; color: #fff; }

        .gesture-item.no-animation { color: #aaa; }

        .empty-note { font-size: 13px; color: #999; padding: 10px; }

        /* ---------- Avatar panel ---------- */
        .avatar-panel {
            grid-area: avatar;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #fff;
        }

        .avatar-wrapper {
            flex: 1;
            min-height: 120px;
            background: #eceef2;
            touch-action: none;
        }

        .CWASAAvatar { width: 100%; height: 100%; }

        .detail-panel {
            flex-shrink: 0;
            max-height: 30vh;
            overflow-y: auto;
            padding: 10px 14px 14px;
            border-top: 1px solid #ddd;
        }

        #gesture-name { font-size: 16px; display: block; }

        #gesture-desc { font-size: 13px; color: #444; margin-top: 6px; line-height: 1.4; }

        /* ---------- Controls bar ---------- */
        .controls-bar {
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-top: 1px solid #ddd;
            background: #fafafa;
        }

        .ctrl-btn {
            border: none;
            border-radius: 6px;
            background: #4a9eff;
            color: #fff;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 600;
            min-height: 40px;
        }

        .ctrl-btn:disabled { background: #c9c9c9; }

        .speed-group { display: flex; gap: 4px; margin-left: auto; }

        .speed-btn {
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            min-height: 36px;
        }

        .speed-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }

        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
        }
    </style>
</head>
<body onload="CWASA.init();">

    <header id="app-header">
        <div class="titles">
            <h1 data-i18n="app.title">Mafia Signs</h1>
            <p data-i18n="app.subtitle">Interactive gesture dictionary for competitive Sports Mafia</p>
        </div>
        <div id="lang-switch">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="uk">UK</button>
            <button class="lang-btn" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="de">DE</button>
        </div>
    </header>

    <main class="layout">
        <section class="avatar-panel">
            <div class="avatar-wrapper">
                <div class="CWASAAvatar av0"></div>
            </div>

            <!-- Hidden: only the speed stepper is reachable through CWASA's
                 native DOM-class auto-wiring (no public JS API for it); true
                 pause/seek isn't exposed by the engine at all, so Play/Pause/
                 Replay/Reset are implemented at the app level instead. -->
            <div hidden>
                <button class="bttnSpeedUp av0" type="button"></button>
                <button class="bttnSpeedDown av0" type="button"></button>
                <button class="bttnSpeedReset av0" type="button"></button>
            </div>

            <div class="controls-bar">
                <button id="btn-play" class="ctrl-btn" type="button" data-i18n="ui.play">Play</button>
                <button id="btn-pause" class="ctrl-btn" type="button" data-i18n="ui.pause">Pause</button>
                <button id="btn-replay" class="ctrl-btn" type="button" data-i18n="ui.replay">Replay</button>
                <button id="btn-reset" class="ctrl-btn" type="button" data-i18n="ui.reset">Reset avatar</button>
                <div class="speed-group">
                    <button class="speed-btn" type="button" data-speed="0.5">0.5×</button>
                    <button class="speed-btn active" type="button" data-speed="1">1×</button>
                    <button class="speed-btn" type="button" data-speed="1.5">1.5×</button>
                </div>
            </div>

            <div class="detail-panel">
                <span id="gesture-name"></span>
                <p id="gesture-desc" data-i18n="ui.selectPrompt">Select a gesture to see it demonstrated.</p>
            </div>
        </section>

        <aside class="sidebar">
            <input id="search-input" type="search" data-i18n-placeholder="ui.searchPlaceholder" placeholder="Search gestures…">
            <div id="category-list"></div>
            <div class="list-scroll">
                <div id="gesture-list"></div>
            </div>
        </aside>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/gestures.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
